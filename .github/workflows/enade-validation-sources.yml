name: Preparar fontes oficiais ENADE 2023
# Execução manual: o INEP pode recusar conexões de runners externos.
# Não transformar indisponibilidade da fonte oficial em falha de CI do código.
on:
  workflow_dispatch:

jobs:
  prepare-official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyMuPDF
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Baixar duas provas oficiais e gerar candidatos para 50 questões
        run: python -m scripts.prepare_50_sources --download --output-dir evidence
      - name: Publicar apenas metadados e candidatos, nunca PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enade-50-source-candidates
          path: |
            evidence/validation_50_candidates.csv
            evidence/validation_50_source_report.json
          if-no-files-found: warn
          retention-days: 7
