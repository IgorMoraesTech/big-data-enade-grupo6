name: End-to-end Docker smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente de testes
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Preparar ambiente local de laboratório
        run: cp .env.example .env
      - name: Iniciar serviços Docker
        run: docker compose up --build -d
      - name: Inspecionar containers
        run: docker compose ps -a
      - name: Enviar evento Kafka de teste (dados fictícios)
        run: docker compose run --rm api python -m scripts.produce sample/example_question.json
      - name: Testar HTTP, Kafka, Elasticsearch, Redis e exportações
        run: python scripts/smoke_e2e.py
      - name: Validar login LDAP real e resposta 403 do estudante
        run: python scripts/smoke_ldap.py
      - name: Validar idempotência, reinício e dead-letter queue
        run: python scripts/smoke_recovery.py
      - name: Medir latência HTTP p50 p95 p99 e cache real
        run: |
          python scripts/benchmark_search.py --query tecnologia --requests 30 --output evidence/benchmark-search.json
          python scripts/benchmark_search.py --query tecnologia --requests 30 --cache-bust --output evidence/benchmark-no-cache.json
      - name: Publicar evidências de teste (não são dados oficiais)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-integration-evidence
          path: evidence/*.json
      - name: Logs para depuração
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=120
      - name: Encerrar ambiente
        if: always()
        run: docker compose down -v --remove-orphans
