name: Python checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: |
          cp .env.example .env
          docker compose config --quiet
