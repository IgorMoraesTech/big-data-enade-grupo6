# Ambiente LOCAL DE LABORATÓRIO; sem autenticação LDAP/Kerberos.
# NUNCA expor este Compose em ambiente público.
services:
  # OpenLDAP para TESTES locais; contas demonstrativas, NÃO usar em produção.
  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "ENADE Laboratorio"
      LDAP_DOMAIN: "enade.local"
      LDAP_ADMIN_PASSWORD: "lab-only-change-me"
      LDAP_TLS: "false"
    volumes:
      - ./infra/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
    command: "--copy-service"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=enade,dc=local -s base '(objectClass=*)' dn >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.9
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  init-index:
    build: .
    env_file: .env
    command: ["python", "-m", "scripts.create_index"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init-index:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build: .
    env_file: .env
    command: ["python", "-m", "app.consumer"]
    depends_on:
      kafka:
        condition: service_healthy
      init-index:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
  elastic-data:
  redis-data:
